<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="../static/css/style.css">
    <meta charset="UTF-8"/>
    <title>Все фильмы</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
<div id="header-placeholder"></div>
<div class="page-layout">
    <aside class="sidebar">
        <h3>Фильтр по статусу</h3>
        <label><input type="radio" name="statusFilter" value="ALL" checked> Все</label><br>
        <label><input type="radio" name="statusFilter" value="PENDING"> Ожидают</label><br>
        <label><input type="radio" name="statusFilter" value="APPROVED"> Одобрены</label><br>
        <label><input type="radio" name="statusFilter" value="REJECTED"> Отклонены</label><br>
    </aside>

    <main class="content">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Поиск по названию...">
            <button id="searchBtn">Поиск</button>
        </div>

        <div id="moviesContainer" class="movie-list"></div>
    </main>
</div>


    </main>
</div>

<script type="module" src="js/admin.js"></script>
<script src="/js/adminHeader.js"></script>
</body>
</html>
